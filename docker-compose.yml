services:
  postgres:
    image: postgres:16-alpine
    container_name: cargasweb0-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cargasweb0
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cargasweb0"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
